<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sparkurity — for organisations</title>
<!--
  1920×1080 · 30 fps motion piece, authored on a 30 s timeline plus reading pauses (HOLDS). Deterministic: every frame is render(videoTime).
  Preview in a browser (plays in real time, press space to pause, ←/→ to scrub),
  or render frames with render.js → ffmpeg. Fonts are local (fonts/) so frames are reproducible.
-->
<style>
@font-face { font-family: 'Fraunces'; src: url('fonts/fraunces.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Inter'; src: url('fonts/inter.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'JetBrains Mono'; src: url('fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'JetBrains Mono'; src: url('fonts/jetbrains-mono-latin-600-normal.woff2') format('woff2'); font-weight: 600; }
:root {
  --spark:#4A95D1; --action:#2F6FA3; --blue-800:#25557C; --blue-100:#D4E6F5; --blue-50:#EDF4FB;
  --petrol:#2C6374; --petrol-dark:#214B58; --petrol-100:#C4D8D4; --petrol-50:#EAF1F0;
  --ink:#2B2C2E; --body:#56575A; --grey:#6D6E71; --grey-200:#CFCFD1; --line:#E7E7E8; --mist:#F4F4F5; --stripe:#FAFBFB;
  --terra:#B25C43; --terra-200:#E4C4B8; --terra-50:#F7EDE9; --success:#2F855A; --success-50:#E7F2EC;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--mist); font-family: 'Inter', sans-serif; color: var(--ink); transform-origin: 0 0; }
.abs { position: absolute; will-change: transform, opacity; }
.bg { position: absolute; inset: 0; opacity: 0; }
.kicker { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; color: var(--action); white-space: nowrap; }
.h { font-family: 'Fraunces', serif; font-weight: 600; letter-spacing: -.01em; line-height: 1.05; white-space: nowrap; font-variation-settings: 'opsz' 144; }
.mono { font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: .08em; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 6px 16px rgba(37,85,124,.10); }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.glow { position: absolute; border-radius: 50%; background: radial-gradient(circle at center, rgba(74,149,209,.32), transparent 65%); pointer-events: none; }
.dots { position: absolute; inset: -60px; background-image: radial-gradient(rgba(44,99,116,.13) 1.6px, transparent 1.7px); background-size: 40px 40px; }
svg { overflow: visible; }
</style>
</head>
<body>
<div id="stage"></div>

<script>
/* ───────────────────────── helpers ───────────────────────── */
const DUR = 30; // authored timeline (seconds)
/* Reading pauses: [authored time, hold seconds]. At each point the content holds still
   while ambient motion keeps running, so every section gets ~2 s to sink in. */
const HOLDS = [[2.72, 2], [5.29, 2], [8.19, 2], [10.29, 2], [15.6, 2], [18.85, 2], [20.65, 2], [24.0, 1], [27.05, 1.7], [29.95, 1.3]];
const TOTAL = DUR + HOLDS.reduce((a, h) => a + h[1], 0);
// video time → authored time
function remap(v) {
  let off = 0;
  for (const [h, d] of HOLDS) {
    if (v < h + off) return v - off;
    if (v < h + off + d) return h;
    off += d;
  }
  return Math.min(DUR, v - off);
}
// authored time → video time (first frame it is reached), used for audio cue placement
function forward(t) { let off = 0; for (const [h, d] of HOLDS) { if (t <= h) break; off += d; } return t + off; }
let A = 0; // ambient clock = video time
const stage = document.getElementById('stage');
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const p = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  out: k => 1 - Math.pow(1 - k, 3),
  in: k => k * k * k,
  io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  back: k => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); },
  expo: k => k === 1 ? 1 : 1 - Math.pow(2, -10 * k),
};
// in/out envelope: fades in over [a,a+fi], out over [b-fo,b]
const env = (t, a, b, fi = .35, fo = .3) => Math.min(E.out(p(t, a, a + fi)), 1 - E.in(p(t, b - fo, b)));

function el(html, style = {}, parent = stage) {
  const d = document.createElement('div');
  d.className = 'abs';
  d.innerHTML = html;
  Object.assign(d.style, style);
  parent.appendChild(d);
  return d;
}
function svgEl(tag, attrs, parent) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  parent.appendChild(n);
  return n;
}
// set transform/opacity in one go
function tf(node, { x = 0, y = 0, s = 1, r = 0, o = 1, sx, sy } = {}) {
  node.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${sx ?? s},${sy ?? s})`;
  node.style.opacity = o;
  node.style.visibility = o <= 0.001 ? 'hidden' : 'visible';
}
// word-by-word headline; returns updater(t, start, stagger)
function words(node) {
  const txt = node.textContent;
  node.innerHTML = txt.split(' ').map(w => `<span style="display:inline-block;will-change:transform,opacity">${w}</span>`).join(' ');
  const spans = [...node.children];
  return (t, a, st = .07, d = .45) => spans.forEach((sp, i) => {
    const k = E.out(p(t, a + i * st, a + i * st + d));
    sp.style.transform = `translateY(${(1 - k) * 46}px)`;
    sp.style.opacity = k;
  });
}
const ICON = {

  user: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  file: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  link: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
  cursor: '<svg width="44" height="44" viewBox="0 0 24 24"><path d="M4 2l15 9.5-6.6 1.3L9 19z" fill="#fff" stroke="#2B2C2E" stroke-width="1.4" stroke-linejoin="round"/></svg>',

const MARK = [
  { pts: '18.54 11.18 18.63 11.43 27.31 7.32 22.97 15.91 23.38 16.06 24.74 16.55 26.78 17.28 31.59 7.17 27.59 3.06 17.38 7.78 18.11 9.92 18.54 11.18', c: 'spark', from: [1, -1] },
  { pts: '13.04 26.45 12.95 26.2 4.26 30.31 8.55 21.82 8.56 21.83 8.61 21.73 8.19 21.58 6.83 21.09 4.86 20.38 0 30.48 4 34.59 14.24 29.91 13.48 27.73 13.04 26.45', c: 'spark', from: [-1, 1] },
  { pts: '.02 7.04 4.67 17.32 6.8 16.62 8.33 16.11 8.33 16.12 8.47 16.07 7.76 14.6 4.3 7.34 11.6 10.91 12.94 11.56 13.47 10.04 14.22 7.92 4.13 3.04 .02 7.04', c: 'grey', from: [-1, -1] },
  { pts: '24.88 20.98 23.12 21.56 23.86 23.12 27.27 30.27 20.08 26.77 18.65 26.08 18.08 27.69 17.36 29.73 27.42 34.6 31.53 30.59 26.89 20.32 24.88 20.98', c: 'grey', from: [1, 1] },
];

}

  const cx = x + 127;

s3.rows = [...s3.budget.querySelectorAll('.row')].map(r => [...r.querySelectorAll('.seg:not(.sc)')]);

  const toClock = E.io(p(t, 18.9, 19.35));
  tf(s5.kicker, { o: in5, y: (1 - E.out(p(t, 16, 16.4))) * 20 });
  s5.hA.forEach((h, i) => { const k = E.out(p(t, 16.1 + i * .15, 16.6 + i * .15)); tf(h, { o: k * (1 - toClock), y: (1 - k) * 50 - toClock * 50 }); });
  s5.hB.forEach((h, i) => { const k = E.out(p(t, 19.2 + i * .12, 19.65 + i * .12)); tf(h, { o: k * in5, y: (1 - k) * 50 }); });
  const cohortOn = in5 * (1 - toClock);
  const ck5 = E.back(p(t, 16.35, 16.85));
  tf(s5.case, { o: clamp(ck5) * cohortOn, s: .6 + .4 * ck5 });
  s5.people.forEach((pp, i) => {
    const k = E.io(p(t, 16.25 + i * .06, 16.95 + i * .06));
    tf(pp.n, { o: clamp(k * 2) * cohortOn, x: lerp(700, pp.x, k), y: lerp(560 + (i % 3) * 120, pp.y, k) });
    const rk = E.out(p(t, 17.0 + i * .07, 17.3 + i * .07));
    pp.dot.style.background = rk > .5 ? pp.role[1] : 'rgba(255,255,255,.16)';
    pp.dot.style.color = rk > .5 ? pp.role[2] : '#fff';
    pp.dot.style.borderColor = rk > .5 ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.4)';
    pp.tag.style.opacity = rk;
    pp.tag.style.transform = `translateX(-50%) translateY(${(1 - rk) * 10}px)`;
    const pk = E.io(p(t, 17.35 + i * .06, 17.85 + i * .06));
    tf(s5.packs[i], { o: (pk > 0 && pk < 1 ? 1 : 0) * cohortOn, x: lerp(CX - 17, pp.x + 23, pk), y: lerp(CY - 21, pp.y + 19, pk) - Math.sin(pk * Math.PI) * 80, r: pk * 360 });
  });
  s5.links.forEach((ln, i) => {
    const k = E.out(p(t, 17.9 + (i % 6) * .05, 18.3 + (i % 6) * .05));
    ln.style.opacity = k * cohortOn * (.35 + .5 * Math.max(0, Math.sin(A * 5 + i * 1.3)));
  });
  tf(s5.live, { o: E.out(p(t, 18.1, 18.4)) * cohortOn, s: E.back(p(t, 18.1, 18.45)) });
  s5.live.querySelector('.ld').style.opacity = .4 + .6 * Math.abs(Math.sin(A * 6));
  s5.notes.forEach((n, i) => tf(n, { o: E.out(p(t, 17.0 + i * .2, 17.35 + i * .2)) * cohortOn, x: (1 - E.out(p(t, 17.0 + i * .2, 17.35 + i * .2))) * -30 }));
  tf(s5.clock, { o: E.out(p(t, 19.25, 19.5)) * in5 });
  const cf = E.io(p(t, 19.4, 20.4));
  s5.clockF.style.width = `${cf * 100}%`;
  s5.marks.forEach((m, i) => {
    const k = E.back(p(t, 19.4 + CLOCK[i][3] * 1.0, 19.7 + CLOCK[i][3] * 1.0));
    m.style.opacity = clamp(k); m.style.translate = `0 ${(1 - k) * 20}px`;
    const own = m.querySelector('.own');
    if (own) own.style.opacity = E.out(p(t, 19.6 + CLOCK[i][3] * 1.0, 19.85 + CLOCK[i][3] * 1.0));
  });

  /* S6 — evidence */
  const in6 = env(t, 21.0, 24.4, .35, .3);
  tf(s6.kicker, { o: in6, y: (1 - E.out(p(t, 21, 21.4))) * 20 });
  s6.h.forEach((h, i) => { const k = E.out(p(t, 21.1 + i * .15, 21.6 + i * .15)); tf(h, { o: k * in6, y: (1 - k) * 50 }); });
  const pk6 = E.out(p(t, 21.15, 21.6));
  tf(s6.panel, { o: pk6 * in6, x: (1 - pk6) * 120 });
  s6.cells.forEach(c => {
    const r = +c.dataset.r, col = +c.dataset.c;
    const k = p(t, 21.5 + (r + col) * .06, 21.7 + (r + col) * .06);
    c.style.background = k > .5 ? LC[+c.dataset.l] : 'var(--mist)';
    c.style.transform = `scale(${.6 + .4 * E.back(k)})`;
  });
  const focusCell = s6.cells.find(c => c.dataset.l === '0');
  const fr = at(focusCell);
  const pulse = t > 22.6 ? ((A - forward(22.6)) % .8) / .8 : 0;
  tf(s6.ringNode, { o: (t > 22.6 ? (1 - pulse) : 0) * in6, x: fr.x + fr.w / 2 - 48, y: fr.y + fr.h / 2 - 38, s: .7 + pulse * .5 });
  const tk = E.back(p(t, 22.7, 23.1));
  tf(s6.toast, { o: clamp(tk) * in6, y: (1 - tk) * 80 });
  s6.notes.forEach((n, i) => tf(n, { o: E.out(p(t, 21.7 + i * .25, 22.05 + i * .25)) * in6, x: (1 - E.out(p(t, 21.7 + i * .25, 22.05 + i * .25))) * -30 }));

  /* S7 */
  const in7 = env(t, 24.4, 27.4, .35, .3);
  const hk7 = E.out(p(t, 24.45, 24.9));
  tf(s7.h, { o: hk7 * in7, y: (1 - hk7) * 40, s: .94 + .06 * hk7 });
  tf(s7.hdrL, { o: E.out(p(t, 24.7, 25)) * in7 });
  tf(s7.hdrR, { o: E.out(p(t, 24.7, 25)) * in7 });
  s7.rows.forEach((r, i) => {
    const a = 24.8 + i * .42;
    const kl = E.out(p(t, a, a + .3));
    tf(r.l, { o: kl * in7 * (1 - .45 * p(t, a + .35, a + .6)), x: (1 - kl) * -30 });
    r.strike.style.width = `calc(${E.io(p(t, a + .25, a + .55)) * 100}% + 12px)`;
    tf(r.arrow, { o: E.out(p(t, a + .35, a + .55)) * in7, x: (1 - E.out(p(t, a + .35, a + .55))) * -20 });
    const kr = E.back(p(t, a + .4, a + .75));
    tf(r.r, { o: clamp(kr) * in7, x: (1 - kr) * 60 });
  });

  /* S8 */
  const in8 = E.out(p(t, 27.55, 28.1));
  s8.logo.style.clipPath = `inset(0 ${(1 - E.out(p(t, 27.55, 28.15))) * 100}% 0 0)`;
  tf(s8.logo, { o: in8 > 0 ? 1 : 0, s: 1.06 - .06 * in8 });
  const tg = E.out(p(t, 28.05, 28.55));
  tf(s8.tag, { o: tg, y: (1 - tg) * 40 });
  const ct = E.back(p(t, 28.5, 28.9));
  tf(s8.cta, { o: clamp(ct), y: (1 - ct) * 30 });

  progF.style.width = `${(A / TOTAL) * 100}%`;
}

/* ───────── fit to window + realtime preview (skipped when rendering frames) ───────── */
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `scale(${s})`; }
window.render = render;
window.TIMELINE = { TOTAL, DUR, HOLDS, forward };
if (!new URLSearchParams(location.search).has('render')) {
  fit(); addEventListener('resize', fit);
  let t0 = performance.now(), paused = false, tp = 0;
  addEventListener('keydown', e => {
    if (e.code === 'Space') { paused = !paused; t0 = performance.now() - tp * 1000; }
    if (e.code === 'ArrowRight') { tp = Math.min(TOTAL, tp + 1); t0 = performance.now() - tp * 1000; }
    if (e.code === 'ArrowLeft') { tp = Math.max(0, tp - 1); t0 = performance.now() - tp * 1000; }
  });
  (function loop() { if (!paused) tp = ((performance.now() - t0) / 1000) % TOTAL; render(tp); requestAnimationFrame(loop); })();
} else { render(0); }
</script>
